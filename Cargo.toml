[package]
name = "anvil"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Terminal multiplexer"

[[bin]]
name = "anvil"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
opaline = { path = "/home/dt/src/ext/opaline", features = ["builtin-themes", "ratatui"] }
clap = { version = "4", features = ["derive"] }
