[package]
name = "anvil"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "One-tool agent: Rust harness, stock CPython guest, smith TUI"
default-run = "smith"

[[bin]]
name = "anvil"
path = "src/bin/anvil.rs"

[[bin]]
name = "smith"
path = "src/bin/smith.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
ureq = { version = "2", features = ["json"] }
portable-pty = "0.8"
vt100 = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
